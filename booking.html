<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHMaaS</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #7c4dff; }
        p { color: #555; }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>Welcome to the Hostel Booking System!</h1>
        <p>Your authentication worked perfectly. This is where students will select their room layout and blocks.</p>
    </div>

</body>
</html>
